<svg width="160" height="48" viewBox="0 0 160 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="iface" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="idepth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="txtmain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="txtshadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>

  <!-- Icon box -->
  <rect width="48" height="48" rx="10" fill="url(#ibg)"/>
  <!-- Left arm face -->
  <polygon points="6,10 12,10 20,32 17,32" fill="url(#iface)"/>
  <!-- Left arm depth -->
  <polygon points="6,10 6,15 17,36 20,32 12,10" fill="url(#idepth)" opacity="0.6"/>
  <!-- Right arm face -->
  <polygon points="42,10 36,10 28,32 31,32" fill="url(#iface)"/>
  <!-- Right arm depth -->
  <polygon points="42,10 42,15 31,36 28,32 36,10" fill="url(#idepth)" opacity="0.6"/>
  <!-- Bottom tip face -->
  <polygon points="17,32 20,32 24,40 28,32 31,32 24,43" fill="url(#iface)"/>
  <!-- Bottom tip depth -->
  <polygon points="17,32 24,43 24,40 20,32" fill="url(#idepth)" opacity="0.5"/>
  <!-- Highlights -->
  <line x1="6" y1="10" x2="12" y2="10" stroke="#bae6fd" stroke-width="0.8" opacity="0.9"/>
  <line x1="36" y1="10" x2="42" y2="10" stroke="#bae6fd" stroke-width="0.8" opacity="0.9"/>

  <!-- VELTRO shadow -->
  <text x="58" y="34" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900"
        letter-spacing="3" fill="url(#txtshadow)" transform="translate(2,3)">VELTRO</text>
  <!-- VELTRO main -->
  <text x="58" y="34" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900"
        letter-spacing="3" fill="url(#txtmain)">VELTRO</text>
  <!-- Accent underline -->
  <rect x="58" y="39" width="94" height="2" rx="1" fill="#0ea5e9" opacity="0.5"/>
  <rect x="58" y="39" width="32" height="2" rx="1" fill="#38bdf8"/>
</svg>
