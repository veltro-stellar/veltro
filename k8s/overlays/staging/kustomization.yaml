apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veltro-staging

bases:
- ../../

namePrefix: staging-

commonLabels:
  environment: staging

patches:
- path: backend-replicas.yaml
- path: frontend-replicas.yaml

images:
- name: veltro/backend
  newTag: staging
- name: veltro/frontend
  newTag: staging

configMapGenerator:
- name: veltro-config
  behavior: merge
  literals:
  - stellar-network=testnet
  - rust-log=info
  - cors-allowed-origins=https://staging.veltro.com
